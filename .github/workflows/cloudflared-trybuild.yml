name: Cloudflared try-build

# Manual try-build: compiles cloudflared at an unpinned upstream tag with the
# Android adaptations, swaps the binary into jniLibs, and builds a debug APK
# for on-device testing. Runs on the branch it is dispatched from; never
# touches master. The APK is uploaded as its own artifact (debug-signed with
# the committed shared debug keystore, so it installs over any CI debug
# build with `pm install -r`; uninstall first only when switching from/to a
# release build).
#
# NOTE: this intentionally does NOT run lint — it is for testing the
# cloudflared binary, not for validating the tree.
# The repo is public, so the try-build APK goes to the private R2 bucket
# (like CI), not to a publicly downloadable GitHub artifact.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "cloudflared upstream tag (e.g. 2026.10.3)"
        required: true
        default: "2026.10.3"
      sha256:
        description: "Expected SHA-256 of the source archive (empty skips verification)"
        required: false
        default: "a6e8f67e33d68c5f5eb30bf480f5e59b487035eb488897bb6e6f390e76dfc8f2"
      go_version:
        description: "Go toolchain version (must satisfy the tag's go.mod)"
        required: true
        default: "1.27.3"

jobs:
  trybuild:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout with submodules
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ inputs.go_version }}

      - name: Install Android SDK components
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "ndk;26.1.10909125" "cmake;3.22.1"

      - name: Build cloudflared for Android
        shell: pwsh
        run: |
          ./tools/build-cloudflared.ps1 -Version '${{ inputs.version }}' -ExpectedSha256 '${{ inputs.sha256 }}' -ModMode 'mod'

      - name: Verify the new binary is packaged
        run: |
          strings app/src/main/jniLibs/arm64-v8a/libcloudflared.so | grep -m1 "${{ inputs.version }}-farside"

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload try-build APK to private R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: |
          set -euo pipefail
          BUCKET="${{ vars.R2_BUCKET }}"; [ -n "$BUCKET" ] || BUCKET="${{ secrets.R2_BUCKET }}"
          ENDPOINT="${{ vars.R2_ENDPOINT }}"; [ -n "$ENDPOINT" ] || ENDPOINT="${{ secrets.R2_ENDPOINT }}"
          [ -n "$BUCKET" ] || { echo "R2_BUCKET is not set (variable or secret)"; exit 1; }
          [ -n "$ENDPOINT" ] || { echo "R2_ENDPOINT is not set (variable or secret)"; exit 1; }
          APK="app/build/outputs/apk/debug/app-debug.apk"
          [ -f "$APK" ] || { echo "APK not found: $APK"; exit 1; }
          aws s3 cp "$APK" "s3://$BUCKET/farside-trybuild/${{ inputs.version }}-${{ github.sha }}/app-debug.apk" --endpoint-url "$ENDPOINT" --region auto
          aws s3 cp "$APK" "s3://$BUCKET/farside-trybuild/latest/app-debug.apk" --endpoint-url "$ENDPOINT" --region auto
          echo "Uploaded try-build APK (${{ inputs.version }}) to R2 farside-trybuild/"
