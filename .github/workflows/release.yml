name: Release

# Signed arm64 release APK uploaded to private R2, not attached to a
# GitHub Release and not uploaded as a GitHub artifact: the repo is
# public, so both of those would make the APK publicly downloadable.
# The GitHub Release entry itself is still created (notes only, no
# APK), and deploy-quest's release mode downloads from R2.
# Exception: v0.1.0-rc8 stays public for DevPost until ~Dec 11, 2026.
# Trigger: push a tag like v1.0.0 (versionName comes from the tag),
# or run manually from the Actions tab.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-release:
    runs-on: ubuntu-24.04
    permissions:
      contents: write # needed to create the release
    steps:
      - name: Checkout with submodules
        uses: actions/checkout@v5
        with:
          submodules: recursive
          fetch-depth: 0 # versionCode derives from commit count

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Install Android SDK components
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "ndk;26.1.10909125" "cmake;3.22.1"

      - name: Derive version from tag
        id: version
        run: |
          TAG="${GITHUB_REF_NAME:-manual}"
          VERSION_NAME="${TAG#v}"
          VERSION_CODE="$(git rev-list --count HEAD)"
          echo "version_name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "version_code=$VERSION_CODE" >> "$GITHUB_OUTPUT"
          echo "Building $VERSION_NAME ($VERSION_CODE)"

      - name: Configure Android signing
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > app/upload-keystore.jks
          cat > key.properties << 'EOF'
          storePassword=${{ secrets.ANDROID_STORE_PASSWORD }}
          keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}
          keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}
          storeFile=app/upload-keystore.jks
          EOF

      - name: Build signed release APK
        run: >
          ./gradlew assembleRelease --stacktrace
          "-PversionName=${{ steps.version.outputs.version_name }}"
          "-PversionCode=${{ steps.version.outputs.version_code }}"

      - name: Clean up keystore
        if: always()
        run: rm -f app/upload-keystore.jks key.properties

      - name: Upload release APK to private R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: |
          set -euo pipefail
          # Same pattern as CI debug / try-build uploads: versioned copy
          # plus latest, plus a tag marker so deploy-quest can log it.
          BUCKET="${{ vars.R2_BUCKET }}"; [ -n "$BUCKET" ] || BUCKET="${{ secrets.R2_BUCKET }}"
          ENDPOINT="${{ vars.R2_ENDPOINT }}"; [ -n "$ENDPOINT" ] || ENDPOINT="${{ secrets.R2_ENDPOINT }}"
          [ -n "$BUCKET" ] || { echo "R2_BUCKET is not set (variable or secret)"; exit 1; }
          [ -n "$ENDPOINT" ] || { echo "R2_ENDPOINT is not set (variable or secret)"; exit 1; }
          TAG="${GITHUB_REF_NAME:-manual}"
          APK="app/build/outputs/apk/release/app-release.apk"
          [ -f "$APK" ] || { echo "Release APK not found: $APK"; exit 1; }
          aws s3 cp "$APK" "s3://$BUCKET/farside-release/$TAG/app-release.apk" --endpoint-url "$ENDPOINT" --region auto
          aws s3 cp "$APK" "s3://$BUCKET/farside-release/latest/app-release.apk" --endpoint-url "$ENDPOINT" --region auto
          printf '%s' "$TAG" > /tmp/farside-release-tag.txt
          aws s3 cp /tmp/farside-release-tag.txt "s3://$BUCKET/farside-release/$TAG/tag.txt" --endpoint-url "$ENDPOINT" --region auto
          aws s3 cp /tmp/farside-release-tag.txt "s3://$BUCKET/farside-release/latest/tag.txt" --endpoint-url "$ENDPOINT" --region auto
          echo "Uploaded release APK ($TAG) to R2 farside-release/"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          # Tags with a hyphen (v1.0.0-rc1, v0.1.0-beta1) become prereleases.
          prerelease: ${{ contains(github.ref_name, '-') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
